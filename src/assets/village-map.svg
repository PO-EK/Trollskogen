<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="meadow" x2="0" y2="1">
      <stop stop-color="#78815d"/>
      <stop offset=".55" stop-color="#687652"/>
      <stop offset="1" stop-color="#566c4c"/>
    </linearGradient>
    <pattern id="grassTexture" width="54" height="48" patternUnits="userSpaceOnUse">
      <path d="M8 32l4-8m0 8 6-5m21 10 3-7" fill="none" stroke="#d0c48a" stroke-width="1.5" opacity=".24"/>
      <circle cx="27" cy="14" r="1.5" fill="#e1d195" opacity=".25"/>
    </pattern>
    <pattern id="logs" width="36" height="22" patternUnits="userSpaceOnUse">
      <rect width="36" height="22" fill="#71543a"/>
      <path d="M0 2h36M0 19h36" stroke="#b18654" stroke-width="3"/>
      <path d="M0 10h36" stroke="#4f4433" stroke-width="2"/>
      <path d="M8 3v6m23 4v5" stroke="#d0a56b" stroke-width="1.5" opacity=".55"/>
    </pattern>
    <pattern id="squareStone" width="38" height="26" patternUnits="userSpaceOnUse">
      <rect width="38" height="26" fill="#b9a77d"/>
      <path d="M0 1h38M0 25h38M19 1v12M0 13h38M8 13v12" fill="none" stroke="#857958" stroke-width="2" opacity=".76"/>
      <path d="M3 4h12m10 0h10M4 17h4m18 4h10" stroke="#d5c596" stroke-width="2" opacity=".65"/>
    </pattern>
    <filter id="softShadow" x="-.2" y="-.3" width="1.4" height="1.7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="2" dy="5" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="tree">
      <ellipse cx="1" cy="12" rx="26" ry="12" fill="#334835" opacity=".28"/>
      <circle cx="-10" cy="0" r="16" fill="#40583d" stroke="#344a36" stroke-width="2"/>
      <circle cx="9" cy="-8" r="19" fill="#526744" stroke="#344a36" stroke-width="2"/>
      <circle cx="-1" cy="-19" r="13" fill="#66734b"/>
      <path d="M-19-3q10-14 20-10m7-11q11 2 15 13" fill="none" stroke="#97a06b" stroke-width="2.5" stroke-linecap="round" opacity=".58"/>
    </g>
    <g id="shrub">
      <ellipse cx="0" cy="7" rx="18" ry="8" fill="#374b36" opacity=".3"/>
      <circle cx="-8" cy="0" r="9" fill="#687750"/>
      <circle cx="3" cy="-4" r="11" fill="#778258"/>
      <circle cx="12" cy="1" r="8" fill="#526b48"/>
    </g>
  </defs>

  <rect width="1000" height="700" fill="url(#meadow)"/>
  <rect width="1000" height="700" fill="url(#grassTexture)"/>
  <path d="M0 77q158-46 312-8t331-12q187-37 357 6v40q-190-38-359 4t-336 1Q137 76 0 119zM0 563q183-38 327 1t338 1q165-40 335 0v55q-173-38-337 1t-340 0Q176 580 0 623z" fill="#a2a176" opacity=".15"/>

  <!-- The road crosses the lower edge and continues east toward the forest. -->
  <path d="M-20 620C168 607 310 625 457 618s299-5 581 8" fill="none" stroke="#484333" stroke-width="76" opacity=".42"/>
  <path d="M-20 616C168 603 310 621 457 614s299-5 581 8" fill="none" stroke="#b49b6a" stroke-width="58"/>
  <path d="M-20 616C168 603 310 621 457 614s299-5 581 8" fill="none" stroke="#d2bd8b" stroke-width="3" stroke-dasharray="17 15" opacity=".76"/>
  <path d="M925 583l37 38-37 38" fill="none" stroke="#806d4b" stroke-width="8" opacity=".82"/>

  <!-- Open village ground: sparse greenery only, with room for location art. -->
  <g opacity=".9">
    <use href="#tree" x="73" y="154" transform="scale(1.35)"/>
    <use href="#tree" x="115" y="229" transform="scale(1.12)"/>
    <use href="#tree" x="72" y="473" transform="scale(1.25)"/>
    <use href="#tree" x="116" y="535" transform="scale(1.1)"/>
    <use href="#tree" x="925" y="157" transform="scale(1.25)"/>
    <use href="#tree" x="914" y="268" transform="scale(1.05)"/>
    <use href="#tree" x="935" y="474" transform="scale(1.2)"/>
    <use href="#tree" x="886" y="548" transform="scale(1.05)"/>
    <use href="#shrub" x="229" y="156" transform="scale(1.2)"/>
    <use href="#shrub" x="813" y="145" transform="scale(1.25)"/>
    <use href="#shrub" x="201" y="494" transform="scale(1.1)"/>
    <use href="#shrub" x="828" y="468" transform="scale(1.1)"/>
    <use href="#shrub" x="368" y="172" transform="scale(.95)"/>
    <use href="#shrub" x="692" y="510" transform="scale(1.05)"/>
  </g>
  <g fill="#e2ce8f" opacity=".66">
    <circle cx="157" cy="348" r="3"/><circle cx="209" cy="394" r="2"/>
    <circle cx="833" cy="365" r="3"/><circle cx="889" cy="404" r="2"/>
    <circle cx="252" cy="544" r="2"/><circle cx="746" cy="186" r="2"/>
  </g>

  <!-- Log palisade enclosing the village; the eastern gate aligns with the square path. -->
  <path d="M169 185Q187 130 252 126H715Q783 132 807 189V474M807 540Q782 572 715 578H251Q187 571 169 518V236" fill="none" stroke="#493b2c" stroke-width="40" stroke-linecap="round" opacity=".48"/>
  <path d="M169 185Q187 130 252 126H715Q783 132 807 189V474M807 540Q782 572 715 578H251Q187 571 169 518V236" fill="none" stroke="url(#logs)" stroke-width="31" stroke-linecap="round"/>
  <path d="M169 185Q187 130 252 126H715Q783 132 807 189V474M807 540Q782 572 715 578H251Q187 571 169 518V236" fill="none" stroke="#d0a36a" stroke-width="3" stroke-dasharray="2 15" stroke-linecap="round" opacity=".83"/>

  <!-- Sharpened log tops make the palisade read clearly as a timber wall. -->
  <g fill="#9b754c" stroke="#4d3d2c" stroke-width="3">
    <path d="M163 181l10-25 10 25zM190 149l8-24 9 23zM228 132l8-23 10 23z"/>
    <path d="M279 126l8-24 9 24zM330 126l8-24 9 24zM381 126l8-24 9 24z"/>
    <path d="M432 126l8-24 9 24zM483 126l8-24 9 24zM534 126l8-24 9 24z"/>
    <path d="M585 126l8-24 9 24zM636 127l8-24 9 24zM687 130l8-24 9 24z"/>
    <path d="M752 144l10-24 10 26zM803 211l24-8-22 20zM807 265l24-7-24 20z"/>
    <path d="M807 320l24-7-24 20zM807 375l24-7-24 20zM807 430l24-7-24 20z"/>
    <path d="M807 546l24 7-22-20zM780 573l12 22-20-19zM730 580l8 24-17-24z"/>
    <path d="M679 580l8 24-17-24zM628 580l8 24-17-24zM577 580l8 24-17-24z"/>
    <path d="M526 580l8 24-17-24zM475 580l8 24-17-24zM424 580l8 24-17-24z"/>
    <path d="M373 580l8 24-17-24zM322 580l8 24-17-24zM271 579l8 24-17-24z"/>
    <path d="M210 571l8 23-19-21zM166 520l-23 8 20-20zM168 465l-24 7 24-20z"/>
    <path d="M168 410l-24 7 24-20zM168 355l-24 7 24-20zM168 300l-24 7 24-20z"/>
    <path d="M168 245l-24 7 24-20zM170 212l-22 1 22-20z"/>
  </g>

  <!-- A wide timber gate sits in the eastern wall. -->
  <g filter="url(#softShadow)">
    <path d="M786 475v65m42-65v65" stroke="#48372a" stroke-width="9"/>
    <path d="M791 486l36 37m-36 0 36-37" stroke="#c49a64" stroke-width="7"/>
    <path d="M780 473h53M780 541h53" stroke="#573f2d" stroke-width="6"/>
  </g>

  <!-- The town square is the only paved area; keep its surroundings clear for buildings. -->
  <path d="M395 278Q500 247 605 278L637 327 624 395Q509 428 388 394L365 333z" fill="#8f805f" opacity=".48" filter="url(#softShadow)"/>
  <path d="M398 270Q500 242 602 270L628 319 616 389Q509 418 397 388L374 326z" fill="url(#squareStone)" stroke="#776b50" stroke-width="6"/>
  <path d="M411 283Q500 260 590 283L610 321 599 375Q507 401 412 376L394 327z" fill="none" stroke="#d6c596" stroke-width="4" opacity=".8"/>
  <g fill="#71674e" opacity=".45">
    <circle cx="412" cy="306" r="3"/><circle cx="583" cy="304" r="3"/>
    <circle cx="434" cy="368" r="3"/><circle cx="579" cy="362" r="3"/>
    <circle cx="498" cy="279" r="2"/><circle cx="507" cy="389" r="2"/>
  </g>

  <!-- A modest packed-earth path runs from the square through the gate and joins the bottom road. -->
  <path d="M503 407C548 449 601 471 656 485s96 14 126 15c22 1 35 14 37 34 3 28-4 54-1 75" fill="none" stroke="#514633" stroke-width="53" opacity=".33"/>
  <path d="M503 404C548 446 601 468 656 482s96 14 126 15c22 1 35 14 37 34 3 28-4 54-1 75" fill="none" stroke="#b59b6b" stroke-width="39"/>
  <path d="M503 404C548 446 601 468 656 482s96 14 126 15c22 1 35 14 37 34 3 28-4 54-1 75" fill="none" stroke="#d3bd8b" stroke-width="2.5" stroke-dasharray="11 12" opacity=".72"/>

  <!-- Small gate-side shrubs frame the entrance without taking over building sites. -->
  <g opacity=".92">
    <use href="#shrub" x="748" y="452" transform="scale(.9)"/>
    <use href="#shrub" x="852" y="472" transform="scale(.9)"/>
    <use href="#shrub" x="771" y="563" transform="scale(.8)"/>
    <use href="#shrub" x="857" y="575" transform="scale(.85)"/>
  </g>
</svg>
